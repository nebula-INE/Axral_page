<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f7f5"><meta name="description" content="Axral Newsroom — 公式発表と最新情報。"><meta property="og:type" content="article"><meta property="og:site_name" content="Axral Newsroom"><meta property="og:title" content="Newsroom — Axral"><meta property="og:description" content="Axralの公式発表と最新情報。"><meta name="twitter:card" content="summary"><title>Newsroom — Axral</title>
<style>
:root{--bg:#f7f7f5;--ink:#171717;--muted:#737370;--line:rgba(20,20,20,.13);--blue:#3569e8;--max:1120px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",YuGothic,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;letter-spacing:-.025em;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}.nav{height:66px;position:sticky;top:0;background:rgba(247,247,245,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(20,20,20,.06)}.navinner{max-width:1240px;margin:auto;padding:0 28px;height:100%;display:flex;align-items:center;justify-content:space-between}.brand{font-size:23px;font-weight:750;letter-spacing:-.075em}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--blue);margin-left:3px}.back{font-size:12px;color:var(--muted)}.back:hover{color:var(--blue)}main{max-width:800px;margin:0 auto;padding:75px 25px 110px}.eyebrow{font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--blue);font-weight:750}.meta{display:flex;gap:15px;align-items:center;font-size:12px;color:var(--muted);margin:22px 0}.tag{color:var(--blue);font-weight:650}h1{font-size:clamp(34px,6vw,62px);line-height:1.15;letter-spacing:-.07em;margin:20px 0}.summary{font-size:17px;line-height:1.9;color:var(--muted);padding:0 0 28px;border-bottom:1px solid var(--line)}.body{font-size:16px;line-height:2.15;padding-top:22px}.body p{margin:0 0 1.5em}.body h2{font-size:27px;line-height:1.4;letter-spacing:-.05em;margin:2em 0 .7em}.body ul{padding-left:1.4em;margin:0 0 1.5em}.body blockquote{border-left:3px solid var(--blue);padding:5px 0 5px 20px;margin:2em 0;color:var(--muted)}.bottom{border-top:1px solid var(--line);margin-top:60px;padding-top:24px;display:flex;justify-content:space-between;gap:15px;font-size:13px}.bottom a:hover{color:var(--blue)}.related{margin-top:58px}.related h2{font-size:22px;letter-spacing:-.05em}.related-list{border-top:1px solid var(--line)}.related-item{display:block;padding:17px 0;border-bottom:1px solid var(--line)}.related-item small{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}.related-item strong{font-size:15px}.related-item:hover strong{color:var(--blue)}.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.tag-chip{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:6px 10px;color:var(--muted)}.share{border:1px solid var(--line);border-radius:99px;background:transparent;padding:9px 13px;cursor:pointer;font-size:12px}.share:hover{border-color:var(--blue);color:var(--blue)}.error{padding:80px 0;text-align:center}.error h1{font-size:36px}.footer{border-top:1px solid var(--line);padding:28px;text-align:center;font-size:11px;color:var(--muted)}@media(max-width:600px){.navinner{padding:0 18px}main{padding:52px 20px 75px}.body{font-size:15px}.summary{font-size:15px}}
</style></head><body><header class="nav"><div class="navinner"><a class="brand" href="index.html">Axral<span class="dot"></span></a><a class="back" href="newsroom.html">← Newsroom一覧へ</a></div></header><main id="main"><p class="eyebrow">Axral Newsroom</p><p>記事を読み込み中…</p></main><footer class="footer">© 2026 Axral. Built for creators.</footer><script src="newsroom-data.js"></script><script>
const params=new URLSearchParams(location.search);const item=(window.AXRAL_ARTICLES||[]).find(a=>a.id===params.get('id')&&a.published!==false);const main=document.getElementById('main');const labels={Company:'会社情報',Product:'プロダクト',Update:'アップデート',Event:'イベント',Media:'メディア'};function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
if(!item){main.replaceChildren(node('p','AXRAL NEWSROOM','eyebrow'));const box=node('section',undefined,'error');box.append(node('h1','記事が見つかりません'),node('p','記事が削除されたか、URLが正しくない可能性があります。'),node('a','Newsroom一覧に戻る'));box.lastChild.href='newsroom.html';main.append(box)}else{document.title=item.title+' — Axral Newsroom';document.querySelector('meta[name="description"]').content=item.summary||item.title;main.replaceChildren();main.append(node('p','Axral Newsroom','eyebrow'));const meta=node('div',undefined,'meta');meta.append(node('time',item.date.replaceAll('-','.'),''),node('span',labels[item.category]||item.category,'tag'));main.append(meta,node('h1',item.title),node('p',item.summary||'','summary'));const body=node('article',undefined,'body');(item.body||[]).forEach(block=>{if(block.type==='heading')body.append(node('h2',block.text));else if(block.type==='list'){const ul=node('ul');(block.items||[]).forEach(t=>ul.append(node('li',t)));body.append(ul)}else if(block.type==='quote')body.append(node('blockquote',block.text));else body.append(node('p',block.text||''))});main.append(body);if(item.tags&&item.tags.length){const tags=node('div',undefined,'tags');item.tags.forEach(t=>tags.append(node('span','# '+t,'tag-chip')));main.append(tags)}const related=(window.AXRAL_ARTICLES||[]).filter(x=>x.id!==item.id&&x.published!==false&&(x.category===item.category||(item.products||[]).some(p=>(x.products||[]).includes(p)))).slice(0,3);if(related.length){const section=node('section',undefined,'related');section.append(node('h2','関連記事'));const list=node('div',undefined,'related-list');related.forEach(x=>{const l=node('a',undefined,'related-item');l.href='article.html?id='+encodeURIComponent(x.id);l.append(node('small',x.date.replaceAll('-','.')+' · '+(labels[x.category]||x.category)),node('strong',x.title));list.append(l)});section.append(list);main.append(section)}const bottom=node('div',undefined,'bottom');const back=node('a','← Newsroom一覧へ');back.href='newsroom.html';const home=node('a','Axralトップページ ↗');home.href='index.html';const share=node('button','記事を共有 ↗','share');share.type='button';share.addEventListener('click',async()=>{try{if(navigator.share)await navigator.share({title:item.title,text:item.summary,url:location.href});else{await navigator.clipboard.writeText(location.href);share.textContent='URLをコピーしました ✓'}}catch(e){}});bottom.append(back,share,home);main.append(bottom)}
</script></body></html>
