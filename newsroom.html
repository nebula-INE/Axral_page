<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f7f5"><meta name="description" content="Axral Newsroom — Axralからのお知らせ、プロダクトのアップデート、公式発表。">
<title>Newsroom — Axral</title>
<style>
:root{--bg:#f7f7f5;--ink:#171717;--muted:#737370;--line:rgba(20,20,20,.13);--blue:#3569e8;--max:1120px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",YuGothic,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;letter-spacing:-.025em;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button,input,select{font:inherit}.nav{height:66px;position:sticky;top:0;z-index:5;background:rgba(247,247,245,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(20,20,20,.06)}.nav-inner{height:100%;max-width:1240px;padding:0 28px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{font-size:23px;font-weight:750;letter-spacing:-.075em}.dot{display:inline-block;width:9px;height:9px;margin:0 0 2px 2px;border-radius:50%;background:var(--blue)}.navlinks{display:flex;gap:28px;font-size:12px;color:#494947}.navlinks a:hover{color:var(--blue)}.pill{padding:10px 16px;border-radius:999px;background:#171717;color:white;font-size:12px}.wrap{max-width:var(--max);margin:auto;padding:0 28px}.hero{padding:100px 0 65px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;letter-spacing:.19em;color:var(--blue);font-weight:750;text-transform:uppercase;margin:0 0 20px}.hero h1{font-size:clamp(54px,9vw,100px);line-height:.98;letter-spacing:-.085em;margin:0;font-weight:730}.intro{max-width:570px;color:var(--muted);font-size:15px;line-height:1.9;margin:26px 0 0}.toolbar{display:grid;grid-template-columns:minmax(200px,1fr) auto auto;gap:12px;padding:28px 0 22px;align-items:center}.search{width:100%;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.6);padding:14px 16px;outline:none}.search:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(53,105,232,.1)}select{border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.6);padding:13px 35px 13px 14px;color:var(--ink)}.filters{display:flex;gap:8px;flex-wrap:wrap;padding:0 0 24px}.filter{border:1px solid var(--line);border-radius:999px;background:transparent;padding:9px 14px;font-size:12px;color:#555;cursor:pointer}.filter.active,.filter:hover{background:#171717;color:white;border-color:#171717}.results-line{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:0 0 13px;font-size:11px;color:var(--muted)}.list{border-top:0}.item{display:grid;grid-template-columns:120px 100px minmax(0,1fr) 24px;gap:20px;align-items:start;padding:25px 0;border-bottom:1px solid var(--line);transition:padding .2s}.item:hover{padding-left:5px;padding-right:5px}.date,.category{font-size:11px;color:var(--muted);padding-top:4px}.category{color:var(--blue);font-weight:650}.item h2{font-size:clamp(19px,2.5vw,25px);letter-spacing:-.05em;margin:0 0 9px;line-height:1.35}.summary{font-size:13px;color:var(--muted);line-height:1.8;margin:0;max-width:690px}.arrow{color:var(--blue);font-size:20px}.empty{padding:55px 0;text-align:center;color:var(--muted);font-size:14px}.loadmore{display:block;margin:28px auto 0;border:1px solid var(--line);border-radius:999px;padding:13px 26px;background:transparent;cursor:pointer}.loadmore:hover{background:#171717;color:white}.foot{border-top:1px solid var(--line);margin-top:100px;padding:28px 0}.footinner{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.footlinks{display:flex;gap:18px}.footlinks a:hover{color:var(--blue)}@media(max-width:680px){.nav{height:60px}.nav-inner{padding:0 18px}.navlinks{gap:12px}.navlinks a:nth-child(2){display:none}.pill{padding:9px 12px}.wrap{padding:0 19px}.hero{padding:76px 0 45px}.intro{font-size:13px}.toolbar{grid-template-columns:1fr 1fr}.search{grid-column:1/-1}.item{grid-template-columns:1fr 24px;gap:8px;padding:21px 0}.date,.category{grid-column:1}.category{grid-row:2}.item>a{grid-column:1;grid-row:3}.arrow{grid-column:2;grid-row:1/4}.item h2{font-size:20px}.summary{font-size:12px}.footinner{align-items:flex-start;flex-direction:column}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head><body>
<header class="nav"><div class="nav-inner"><a class="brand" href="index.html">Axral<span class="dot"></span></a><nav class="navlinks"><a href="index.html#products">プロダクト</a><a href="index.html#philosophy">Axralについて</a><a href="newsroom.html" style="color:var(--blue)">Newsroom</a></nav><a class="pill" href="index.html#products">プロダクトを見る</a></div></header>
<main class="wrap"><section class="hero"><p class="eyebrow">Axral Newsroom</p><h1>ニュースと、<br>これからの話。</h1><p class="intro">Axralからのお知らせ、プロダクトのアップデート、公式発表。<br>創作の道具をつくる私たちの最新情報を、ここからお届けします。</p></section>
<section aria-label="ニュース一覧"><div class="toolbar"><input class="search" id="search" type="search" placeholder="キーワードで検索" aria-label="ニュースを検索"><select id="year" aria-label="年で絞り込む"><option value="all">すべての年</option></select><select id="sort" aria-label="並び順"><option value="new">新しい順</option><option value="old">古い順</option></select></div><div class="filters" id="filters" aria-label="カテゴリで絞り込む"><button class="filter active" data-category="all">すべて</button><button class="filter" data-category="Company">会社情報</button><button class="filter" data-category="Product">プロダクト</button><button class="filter" data-category="Update">アップデート</button><button class="filter" data-category="Event">イベント</button><button class="filter" data-category="Media">メディア</button></div><div class="results-line"><span id="count" aria-live="polite">記事を読み込み中…</span><span>AXRAL / NEWSROOM</span></div><div class="list" id="list"></div><p class="empty" id="empty" hidden>条件に一致する記事はありません。検索語やカテゴリを変更してください。</p><button class="loadmore" id="loadmore" hidden>もっと見る</button></section></main>
<footer class="foot"><div class="wrap footinner"><a class="brand" href="index.html">Axral<span class="dot"></span></a><span>© 2026 Axral. Built for creators.</span><div class="footlinks"><a href="index.html#products">プロダクト</a><a href="newsroom.html">Newsroom</a><a href="https://github.com/nebula-INE/Axral_page">GitHub</a></div></div></footer>
<script src="newsroom-data.js"></script><script>
const all=(window.AXRAL_ARTICLES||[]).filter(a=>a.published!==false);const pageSize=8;let category='all',shown=pageSize;
const $=id=>document.getElementById(id);const fmt=d=>{const p=d.split('-');return p.length===3?p.join('.'):d};
[...new Set(all.map(a=>a.date.slice(0,4)))].sort().reverse().forEach(y=>{const o=document.createElement('option');o.value=y;o.textContent=y;$('year').append(o)});
function render(){const q=$('search').value.trim().toLocaleLowerCase();const y=$('year').value;const sorted=[...all].sort((a,b)=>$('sort').value==='new'?b.date.localeCompare(a.date):a.date.localeCompare(b.date));const filtered=sorted.filter(a=>(category==='all'||a.category===category)&&(y==='all'||a.date.startsWith(y))&&(!q||[a.title,a.summary,a.category,...(a.tags||[])].join(' ').toLocaleLowerCase().includes(q)));const visible=filtered.slice(0,shown);$('count').textContent=filtered.length+'件の記事';$('empty').hidden=filtered.length>0;$('list').replaceChildren();visible.forEach(a=>{const row=document.createElement('article');row.className='item';const date=document.createElement('span');date.className='date';date.textContent=fmt(a.date);const cat=document.createElement('span');cat.className='category';cat.textContent=({Company:'会社情報',Product:'プロダクト',Update:'アップデート',Event:'イベント',Media:'メディア'})[a.category]||a.category;const link=document.createElement('a');link.href='article.html?id='+encodeURIComponent(a.id);const title=document.createElement('h2');title.textContent=a.title;const summary=document.createElement('p');summary.className='summary';summary.textContent=a.summary||'';link.append(title,summary);const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='↗';row.append(date,cat,link,arrow);$('list').append(row)});$('loadmore').hidden=visible.length>=filtered.length}
$('search').addEventListener('input',()=>{shown=pageSize;render()});$('year').addEventListener('change',()=>{shown=pageSize;render()});$('sort').addEventListener('change',()=>{shown=pageSize;render()});$('filters').addEventListener('click',e=>{const b=e.target.closest('button[data-category]');if(!b)return;category=b.dataset.category;shown=pageSize;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});$('loadmore').addEventListener('click',()=>{shown+=pageSize;render()});render();
</script></body></html>
